name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: pure-Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # job validation, materials and verdicts need only the standard library;
      # the FreeCAD-side benchmarks (tests/fc_benchmarks.py) are tracked in a separate issue
      - name: unit tests
        run: python -I tests/test_job.py -v
      - name: byte-compile every module
        run: python -m compileall -q fcharness run.py tests examples
